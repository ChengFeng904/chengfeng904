[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-system"
version = "0.1.0"
description = "基于多Agent架构的A股智能投研系统"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
web = [
    "streamlit>=1.30.0",
    "matplotlib>=3.6.0",
    "mplfinance>=0.12.10b0",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["data/", "reports/"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "W",      # pycodestyle warnings
]
ignore = [
    "E501",   # line too long (已由 line-length 处理)
    "F401",   # 部分模块延迟导入，可能未使用
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402"]
"main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
